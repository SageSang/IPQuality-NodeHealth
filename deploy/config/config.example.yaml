inventory:
  # Sub-Store inventory collection: keep every real node and do not apply the
  # health sorting script to this collection.
  url: "${SUB_STORE_INVENTORY_URL}"
  timeout_seconds: 90
  headers: {}

data_dir: /app/data
reports_dir: /app/reports

http:
  host: 0.0.0.0
  port: 8080
  api_token: "${NODE_HEALTH_API_TOKEN:-}"

schedule:
  enabled: true
  time: "03:30"
  timezone: Asia/Shanghai
  default_mode: maintenance

probe:
  controller_url: http://mihomo-probe:9090
  controller_listen: 0.0.0.0:9090
  controller_secret: ""
  listener_host: 0.0.0.0
  proxy_host: mihomo-probe
  mihomo_binary: /usr/local/bin/mihomo
  ipquality_script: /app/ip.sh
  start_port: 20000
  startup_timeout_seconds: 30
  request_timeout_seconds: 15
  concurrency: 8
  full_concurrency: 3
  samples: 3
  ip_url: https://api.ipify.org?format=json
  geo_url_template: https://ipapi.co/{ip}/json/
  google_url: https://www.gstatic.com/generate_204
  chatgpt_url: https://chatgpt.com/cdn-cgi/trace
  # An unavailable node is checked again after 2 and then 5 minutes before the
  # day is counted as unavailable. Set shorter values only for tests.
  unavailable_retry_delays_seconds: [120, 300]
  claude_timeout_seconds: 8
  claude_trace_url: https://claude.ai/cdn-cgi/trace
  anthropic_trace_url: https://www.anthropic.com/cdn-cgi/trace
  # IPinfo Core/Plus lookup. A token is needed for reliable privacy/hosting
  # evidence; without one only whatever the provider returns is used.
  claude_ipinfo_url_template: https://api.ipinfo.io/lookup/{ip}
  claude_ipinfo_token: ${IPINFO_TOKEN:-}
  # The anonymous ipapi.is endpoint is rate-limited. Configure IPAPI_KEY for
  # larger pools and complete responses.
  claude_ipapi_url_template: https://api.ipapi.is/?q={ip}
  claude_ipapi_key: ${IPAPI_KEY:-}
  # OpenAI ChatGPT web/mobile support snapshot checked 2026-09-02. Override
  # this ISO alpha-2 list when the official page changes.
  chatgpt_supported_countries_snapshot: "2026-09-02"
  # Anthropic consumer availability snapshot published 2026-03-16. Override
  # this ISO alpha-2 list when the official page changes.
  claude_supported_countries_snapshot: "2026-03-16"

policy:
  # maintenance keeps these identities unordered and fixed; rebuild lets all
  # fully audited candidates compete for these slots again.
  stable_slots: 3
  stable_protection_min_healthy_days: 6
  stable_unavailable_grace_days: 1
  # Stable slots and the three strongest challengers are audited every day;
  # half of the remaining pool rotates daily.
  full_audit_daily_fraction: 0.5
  promotion_challengers_per_region: 3
  # Kept for backwards-compatible config parsing. Publication no longer uses
  # this ratio: unreachable nodes are retained at the ranking tail.
  minimum_publish_available_ratio: 0.2
  # Kept for backwards-compatible config parsing. A rebuild publishes after
  # quick-scan completion even when individual full audits fail.
  minimum_rebuild_full_completion_ratio: 0.8
  # A JSON result is not trusted for ordering until at least this many
  # independent risk-score providers returned usable values.
  min_valid_risk_sources: 3
  # Claude dedicated egress has two independent providers and is evaluated as
  # a separate route; its evidence never fills the generic egress quota.
  claude_min_valid_risk_sources: 2
  # One noisy DNSBL listing is only a warning. Three independent listings are
  # required before DNSBL alone can trigger a stable-slot redline.
  dnsbl_redline_threshold: 3
  dnsbl_severe_threshold: 3
  # A new stable candidate must succeed in at least two of the default three
  # public-egress samples. Existing slots are preserved when this is uncertain.
  minimum_candidate_success_rate: 0.6666
  # Controlled maintenance promotion. A transiently unavailable or missing
  # stable identity is never used as the weakest comparison target.
  promotion_enabled: true
  promotion_min_healthy_days: 6
  promotion_evidence_days: 3
  promotion_score_margin: 15
  promotion_max_per_region_per_run: 1
  promotion_cooldown_days: 7
  mass_outage_current_ratio: 0.20
  mass_outage_drop_ratio: 0.60
  mass_outage_min_nodes: 5
  mass_outage_min_identity_overlap: 0.60
  claude_service_failure_ratio: 0.80
  # Count distinct service egresses, not aliases sharing the same route.
  ai_service_outage_min_egresses: 5
  expected_country:
    hong-kong: HK
    taiwan: TW
    japan: JP
    singapore: SG
    united-states: US
    south-korea: KR
    united-kingdom: GB
    germany: DE
    france: FR
    canada: CA
    australia: AU

report:
  markdown: true
  json: true
  include_exit_ip: true
  include_raw_details: true
  retention_days: 30

audit:
  enabled: true
  # Leave empty to allow only the same scheme/host/port as inventory.url.
  # Add another exact origin only when audits must read a second Sub-Store.
  allowed_origins: []
  max_subscription_bytes: 10485760
  max_nodes: 500

local_socks:
  stable_slots: 3
  dynamic_offset: 3
  # Address used by AdsPower and other LAN clients to reach OpenWrt SOCKS5
  # listeners. Keep this identical to OpenWrt ADVERTISE_HOST.
  advertise_host: "${LOCAL_SOCKS_ADVERTISE_HOST:-192.0.2.4}"
  region_order:
    - hong-kong
    - taiwan
    - japan
    - singapore
    - united-states
    - south-korea
    - united-kingdom
    - germany
    - france
    - canada
    - australia
    - other
  port_bases:
    hong-kong: 62000
    taiwan: 62200
    japan: 62400
    singapore: 62600
    united-states: 62800
    south-korea: 63000
    united-kingdom: 63200
    germany: 63400
    france: 63600
    canada: 63800
    australia: 64000
    other: 64200

regions:
  hong-kong:
    - '🇭🇰|香港|港(?!口)|Hong\s*Kong|(?-i:\bHK\b)'
  taiwan:
    - '🇹🇼|台湾|臺灣|台北|臺北|台中|臺中|台南|臺南|高雄|Taiwan|Taipei|Hinet|(?-i:\bTW\b)'
  japan:
    - '🇯🇵|日本|Japan|Tokyo|Osaka|东京|大阪|(?-i:\bJP\b)'
  singapore:
    - '🇸🇬|新加坡|狮城|獅城|Singapore|(?-i:\bSG\b)'
  united-states:
    - '🇺🇸|美国|美國|United\s*States|Los\s*Angeles|San\s*Francisco|Seattle|New\s*York|洛杉矶|洛杉磯|西雅图|西雅圖|纽约|紐約|夏威夷|(?-i:\bUS\b)|(?-i:\bUSA\b)'
  south-korea:
    - '🇰🇷|韩国|韓國|South\s*Korea|Korea|Seoul|首尔|首爾|(?-i:\bKR\b)'
  united-kingdom:
    - '🇬🇧|英国|英國|United\s*Kingdom|Great\s*Britain|Britain|England|London|Manchester|伦敦|倫敦|(?-i:\bUK\b)'
  germany:
    - '🇩🇪|德国|德國|Germany|Deutschland|Frankfurt|Berlin|法兰克福|法蘭克福|(?-i:\bDE\b)'
  france:
    - '🇫🇷|法国|法國|France|Paris|巴黎|(?-i:\bFR\b)'
  canada:
    - '🇨🇦|加拿大|Canada|Toronto|Vancouver|多伦多|多倫多|(?-i:\bCA\b)'
  australia:
    - '🇦🇺|澳大利亚|澳大利亞|澳洲|Australia|Sydney|Melbourne|Perth|Brisbane|悉尼|(?-i:\bAU\b)'
